<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Working Memory icon exploration</title>
<style>
body { margin: 0; font-family: Arial, sans-serif; background: #fff; color: #181818; }
main { padding: 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; align-items: start; }
figure { margin: 0; }
img { width: 100%; height: auto; display: block; border: 1px solid #e5e5e5; border-radius: 8px; background: #fafafa; }
figcaption { margin-top: 8px; font-size: 13px; line-height: 1.3; color: #333; }
.prompt-card { border: 1px solid #e5e5e5; border-radius: 8px; padding: 14px; background: #fafafa; }
.prompt-card figcaption { margin-top: 0; font-weight: 700; }
.prompt-card figcaption span { display: inline-block; margin-left: 6px; color: #7a4b16; font-weight: 600; }
.prompt-card p { margin: 10px 0 0; font-size: 12px; line-height: 1.45; color: #555; }
.empty-state { border: 1px solid #e5e5e5; border-radius: 8px; padding: 18px; color: #555; background: #fafafa; }

.tile-controls { display: flex; gap: 6px; margin-top: 7px; opacity: .86; }
.tile-controls button, .tile-controls a { border: 1px solid #dfdfdf; border-radius: 7px; background: #fff; color: #333; cursor: pointer; font: inherit; font-size: 11px; font-weight: 650; line-height: 1; padding: 6px 8px; text-decoration: none; }
.tile-controls button:hover, .tile-controls a:hover { background: #f6f6f6; }
figure.selected img { outline: 3px solid #181818; outline-offset: 2px; }
figure.hidden { display: none; }
.image-viewer { border: 0; border-radius: 10px; padding: 0; max-width: min(94vw, 1400px); background: transparent; }
.image-viewer::backdrop { background: rgba(0, 0, 0, .72); }
.image-viewer-inner { display: grid; gap: 8px; padding: 10px; background: #fff; border-radius: 10px; }
.image-viewer img { max-width: 90vw; max-height: 84vh; width: auto; border: 0; border-radius: 8px; }
.viewer-close { justify-self: end; border: 1px solid #ddd; background: #fff; border-radius: 999px; cursor: pointer; padding: 6px 10px; }

</style>
</head>
<body><main><div class="grid"><figure data-card-id="thread-through-snapshot"><a class="image-link" href="generated/03-thread-through-snapshot.png"><img src="generated/03-thread-through-snapshot.png" alt="Selected — Thread Through Snapshot"></a><div class="tile-controls"><button class="select-card" type="button" aria-pressed="false">Select</button><a class="download-card" href="generated/03-thread-through-snapshot.png" download="03-thread-through-snapshot.png">Download</a><button class="remove-card" type="button" aria-label="Remove Selected — Thread Through Snapshot">Remove</button></div><figcaption>01. Selected — Thread Through Snapshot</figcaption></figure><figure data-card-id="folded-w-memory-thread"><a class="image-link" href="generated/01-folded-w-memory-thread.png"><img src="generated/01-folded-w-memory-thread.png" alt="Folded-W Memory Thread"></a><div class="tile-controls"><button class="select-card" type="button" aria-pressed="false">Select</button><a class="download-card" href="generated/01-folded-w-memory-thread.png" download="01-folded-w-memory-thread.png">Download</a><button class="remove-card" type="button" aria-label="Remove Folded-W Memory Thread">Remove</button></div><figcaption>02. Folded-W Memory Thread</figcaption></figure><figure data-card-id="capture-resume-loop"><a class="image-link" href="generated/02-capture-resume-loop.png"><img src="generated/02-capture-resume-loop.png" alt="Capture / Resume Loop"></a><div class="tile-controls"><button class="select-card" type="button" aria-pressed="false">Select</button><a class="download-card" href="generated/02-capture-resume-loop.png" download="02-capture-resume-loop.png">Download</a><button class="remove-card" type="button" aria-label="Remove Capture / Resume Loop">Remove</button></div><figcaption>03. Capture / Resume Loop</figcaption></figure><figure data-card-id="interlocking-continuity-links"><a class="image-link" href="generated/04-interlocking-continuity-links.png"><img src="generated/04-interlocking-continuity-links.png" alt="Interlocking Continuity Links"></a><div class="tile-controls"><button class="select-card" type="button" aria-pressed="false">Select</button><a class="download-card" href="generated/04-interlocking-continuity-links.png" download="04-interlocking-continuity-links.png">Download</a><button class="remove-card" type="button" aria-label="Remove Interlocking Continuity Links">Remove</button></div><figcaption>04. Interlocking Continuity Links</figcaption></figure><figure data-card-id="memory-bridge"><a class="image-link" href="generated/05-memory-bridge.png"><img src="generated/05-memory-bridge.png" alt="Memory Bridge"></a><div class="tile-controls"><button class="select-card" type="button" aria-pressed="false">Select</button><a class="download-card" href="generated/05-memory-bridge.png" download="05-memory-bridge.png">Download</a><button class="remove-card" type="button" aria-label="Remove Memory Bridge">Remove</button></div><figcaption>05. Memory Bridge</figcaption></figure><figure data-card-id="nested-thread"><a class="image-link" href="generated/06-nested-thread.png"><img src="generated/06-nested-thread.png" alt="Nested Thread"></a><div class="tile-controls"><button class="select-card" type="button" aria-pressed="false">Select</button><a class="download-card" href="generated/06-nested-thread.png" download="06-nested-thread.png">Download</a><button class="remove-card" type="button" aria-label="Remove Nested Thread">Remove</button></div><figcaption>06. Nested Thread</figcaption></figure></div></main>
<dialog class="image-viewer" id="imageViewer">
  <div class="image-viewer-inner">
    <button class="viewer-close" type="button">Close</button>
    <img id="viewerImage" alt="">
  </div>
</dialog>
<script>
(function () {
  var key = "creative-production-review:" + location.pathname;
  var stored = {};
  try { stored = JSON.parse(localStorage.getItem(key) || "{}"); } catch (error) { stored = {}; }
  var selected = new Set(stored.selected || []);
  var hidden = new Set(stored.hidden || []);
  function persist() {
    localStorage.setItem(key, JSON.stringify({ selected: Array.from(selected), hidden: Array.from(hidden) }));
  }
  document.querySelectorAll("figure[data-card-id]").forEach(function (card) {
    var id = card.getAttribute("data-card-id");
    if (selected.has(id)) card.classList.add("selected");
    if (hidden.has(id)) card.classList.add("hidden");
    var select = card.querySelector(".select-card");
    if (select) {
      select.setAttribute("aria-pressed", selected.has(id) ? "true" : "false");
      select.textContent = selected.has(id) ? "Selected" : "Select";
      select.addEventListener("click", function () {
        if (selected.has(id)) selected.delete(id);
        else selected.add(id);
        card.classList.toggle("selected", selected.has(id));
        select.setAttribute("aria-pressed", selected.has(id) ? "true" : "false");
        select.textContent = selected.has(id) ? "Selected" : "Select";
        persist();
      });
    }
    var remove = card.querySelector(".remove-card");
    if (remove) {
      remove.addEventListener("click", function () {
        hidden.add(id);
        card.classList.add("hidden");
        persist();
      });
    }
  });
  var viewer = document.getElementById("imageViewer");
  var viewerImage = document.getElementById("viewerImage");
  if (viewer && viewerImage) {
    document.querySelectorAll(".image-link").forEach(function (link) {
      link.addEventListener("click", function (event) {
        event.preventDefault();
        viewerImage.src = link.getAttribute("href");
        if (typeof viewer.showModal === "function") viewer.showModal();
        else location.href = link.getAttribute("href");
      });
    });
    viewer.querySelector(".viewer-close").addEventListener("click", function () { viewer.close(); });
    viewer.addEventListener("click", function (event) { if (event.target === viewer) viewer.close(); });
  }
}());
</script>
</body>
</html>
